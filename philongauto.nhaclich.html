   - Tracy chốt 10/11: thêm 2 hotline dưới đường kẻ vàng —
     KÊNH PHÂN PHỐI 0866 478 777 · TƯ VẤN BẢO DƯỠNG - SỬA CHỮA XE CHÂU ÂU 0865 100 096.
   - Tracy chốt 10/11: màu vàng của thẻ đổi sang VÀNG CHUẨN MICHELIN #FCE500
     (lấy từ michelin.vn), áp cho đường kẻ, viên vàng, ô tick và góc chân thẻ.
   - Tracy chốt 10/11: nền chữ AUTO.COM trong logo đổi từ cam sang vàng Michelin
     -> ảnh wordmark đổi màu được NHÚNG THẲNG vào file này dạng base64;
     file ảnh gốc plg_wordmark.png trong repo GIỮ NGUYÊN, không đụng tới.
   - Bố cục dựng lại ĐÚNG MẪU IN CHUẨN "the-treo-xem-truoc.png" (764x958 px)
     quy đổi 1 px mẫu = 90/764 mm  ->  thẻ 90 x 112.9 mm, in 1 trang.
   - 6 ô dịch vụ TỰ TICK theo dịch vụ đã làm trên phiếu in (chuỗi &data=).
   - Mốc km/ngày theo ma trận Michelin Car Service (Maintenance pakage.xlsx)
     + cấu hình tab DM_CAP_BD: 5.000 km hoặc 3 tháng, cái nào tới trước.
   KHÔNG đổi bố cục/chữ/màu của mẫu. Chỉ sửa phần CAU_HINH bên dưới.
========================================================================= */
:root{

.khuyen b{font-weight:800}

.ic svg{width:55%;height:55%;fill:#fff}

.ln svg{width:2.85mm;height:2.85mm;fill:var(--navy);flex:none}

<body>
<div class="bar">
  <b>THẺ TREO NHẮC LỊCH — PHI LONG AUTO</b>
  <span class="sp"></span>
  <button onclick="window.print()">In / Lưu PDF</button>
  <button class="ghost" onclick="location.href=ZALO_OA">Zalo OA</button>
</div>
<div id="canhbao"></div>
<div class="khung" id="the"></div>

<script>
/* ===================== CAU_HINH — sửa đúng chỗ này ===================== */
var CAU_HINH = {
  CHU_KY_KM      : 5000,   /* DM_CAP_BD: chu kỳ bảo dưỡng theo km            */
  CHU_KY_THANG   : 3,      /* DM_CAP_BD: chu kỳ bảo dưỡng theo tháng         */
  NHAC_TRUOC_NGAY: 7,      /* DM_CAP_BD: số ngày báo TỚI HẠN trước hạn       */
  KM_DAO_LOP     : 10000,  /* Đảo lốp / Cân bằng động: A từ Cấp trung bình   */
  KM_TB_NGAY     : 0       /* KHÔNG dùng: quy đổi km->ngày không phải chuẩn hãng */
};
var ZALO_OA = 'https://zalo.me/s/4166041222749405453/';

/* CHU KỲ THAY NHỚT THEO LOẠI DẦU BÁN TRÊN PHIẾU (Tracy chốt 09/11/2026)
   Thay dầu tại km = KM HIỆN TẠI + số km của loại dầu đã bán.
   CHỈ TÍNH KHI PHIẾU CÓ BÁN NHỚT. Không có nhớt -> dòng này ĐỂ TRỐNG.     */
var CHU_KY_NHOT = [
  {ten:'UNIL OPAL', tu:['unil opal','unilopal','unil-opal','unil'], km:9000},
  {ten:'Q9000',     tu:['q9000','quartz 9000','q 9000'],            km:9000},
  {ten:'Q7000',     tu:['q7000','quartz 7000','q 7000'],            km:7000},
  {ten:'Q5000',     tu:['q5000','quartz 5000','q 5000'],            km:5000}
];
function chuKyNhot(dong){
  for(var i=0;i<CHU_KY_NHOT.length;i++){
    for(var j=0;j<dong.length;j++){
      var t=boDau(dong[j].ten).replace(/\s+/g,' ');
      if(CHU_KY_NHOT[i].tu.some(function(k){return t.indexOf(k)!==-1;})) return CHU_KY_NHOT[i];
    }
  }
  return null;
}

/* 6 ô trên mẫu in — KHÔNG đổi thứ tự, không đổi chữ.
   Ô được tick theo CẤP BẢO DƯỠNG CỦA MỐC KM KẾ TIẾP (ma trận Michelin Car
   Service, file "Maintenance pakage.xlsx"), KHÔNG phải theo việc đã làm hôm nay.
   nho = Cấp nhỏ (5K,15K,25K...) · tb = Cấp trung bình (10K,30K,50K...)
   tbl = Cấp trung bình lớn (20K,60K,100K...) · lon = Cấp lớn (40K,80K,120K...) */
var O_TICK = [
 {ten:'Đảo lốp',                      cap:['tb','tbl','lon']},   /* A từ Cấp trung bình   */
 {ten:'Cân bằng động',                cap:['tb','tbl','lon']},   /* A từ Cấp trung bình   */
 {ten:'Kiểm tra thước lái (độ chụm)', cap:['nho','tb','tbl','lon']}, /* Góc đặt bánh xe   */
 {ten:'Kiểm tra lốp',                 cap:['nho','tb','tbl','lon']}, /* Kiểm tra an toàn  */
 {ten:'Láng đĩa',                     cap:['tb','tbl','lon']},   /* Phanh: A từ cấp TB    */
 {ten:'Kiểm tra an toàn xe (3 tháng)',cap:['nho','tb','tbl','lon']} /* bắt buộc mọi cấp   */
];
/* Hạng mục THAY THẾ (R) của từng cấp, đưa xuống dòng "DV khác".
   Dầu động cơ đã có dòng "Thay dầu (Nhớt) tại km" nên không lặp lại ở đây. */
var DV_KHAC_THEO_CAP = {
 nho : [],
 tb  : ['Lọc dầu ĐC','Gạt mưa'],
 tbl : ['Lọc dầu ĐC','Lọc gió ĐC','Lọc gió máy lạnh','Ắc quy','Gạt mưa'],
 lon : ['Lọc dầu ĐC','Lọc gió ĐC','Lọc gió máy lạnh','Ắc quy','Gạt mưa','Dầu phanh']
};
/* ===================== hết phần cấu hình ===================== */

function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
  return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
function boDau(s){return (s||'').toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();}
function soNguyen(v){var n=parseInt(String(v||'').replace(/[^\d-]/g,''),10);return isNaN(n)?null:n;}
function laSo(v){var s=String(v==null?'':v).trim();return !!s&&/^-?[\d.,\s]+$/.test(s);}
function dinhDang(n){return (n==null||isNaN(n))?'':Math.round(n).toLocaleString('vi-VN');}
function docNgay(s){s=String(s||'').trim();if(!s)return null;
  var m=/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(s);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null;}
function inNgay(d){if(!(d instanceof Date)||isNaN(d))return '';
  var p=function(x){return (x<10?'0':'')+x;};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();}
function themThang(d,n){var x=new Date(d.getTime()),ng=x.getDate();
  x.setMonth(x.getMonth()+n);if(x.getDate()<ng)x.setDate(0);return x;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- 1. Đọc tham số ---------- */
var P={bienso:qs('bienso')||qs('bs'), kh:qs('kh'), cn:qs('cn'),
       km:soNguyen(qs('km')), ngay:docNgay(qs('ngay')), data:qs('data')};
if(!P.ngay){var h=new Date();h.setHours(0,0,0,0);P.ngay=h;}

/* ---------- 2. Tách chuỗi data của nút In bill ----------
   dòng nối bằng _b_ , cột nối bằng _a_ ; tên hàng có thể kèm _c_<giá gốc>
   Kiểu bill : ten_sp[_c_giá gốc] _a_ giá bán _a_ số lượng
   Kiểu đầy đủ: ten_sp _a_ nhom_hang _a_ ngay _a_ km                        */
function docDong(d){
  var c=d.split('_a_'), ten=(c[0]||'').split('_c_')[0].trim();
  if(!ten) return null;
  var kieuBill = laSo(c[1]) || c.length<3;
  return {ten:ten, nhom: kieuBill?'':(c[1]||'').trim().toUpperCase()};
}
var DONG = (P.data?P.data.split('_b_'):[]).map(docDong).filter(Boolean);

/* ---------- 3. Mốc km, cấp bảo dưỡng kế tiếp ---------- */
function mocKeTiep(km,buoc){return (Math.floor(km/buoc)+1)*buoc;}
function maCap(moc){var n=moc/CAU_HINH.CHU_KY_KM;
  if(n%8===0)return 'lon'; if(n%4===0)return 'tbl';
  if(n%2===0)return 'tb';  return 'nho';}
var TEN_CAP={nho:'Cấp nhỏ',tb:'Cấp trung bình',tbl:'Cấp trung bình lớn',lon:'Cấp lớn'};

/* ---------- 4. Mốc km & ngày hẹn ---------- */
var KQ={kmLop:'',kmDau:'',hanNgay:'',hen:'',cap:'nho',tenCap:'',canh:''};
var HOM_NAY=new Date(); HOM_NAY.setHours(0,0,0,0);

/* --- Mốc thời gian: chuẩn hãng = ngày làm dịch vụ + 3 tháng --- */
var hanTg = themThang(P.ngay, CAU_HINH.CHU_KY_THANG);
KQ.hanNgay = inNgay(hanTg);

/* --- Ngày hẹn = trước hạn 7 ngày, để khách tới TRƯỚC khi quá hạn --- */
var henTg = new Date(hanTg.getTime());
henTg.setDate(henTg.getDate() - CAU_HINH.NHAC_TRUOC_NGAY);

/* --- Mốc km theo cấp bảo dưỡng --- */
if(P.km!==null && P.km>0){
  var mDau=mocKeTiep(P.km,CAU_HINH.CHU_KY_KM);
  var mLop=mocKeTiep(P.km,CAU_HINH.KM_DAO_LOP);
  /* Cấp bảo dưỡng vẫn theo mốc 5.000 chuẩn Michelin */
  KQ.cap=maCap(mDau); KQ.tenCap=TEN_CAP[KQ.cap];
  /* Riêng dòng THAY DẦU chạy theo loại nhớt đã bán */
  var nhot=chuKyNhot(DONG);
  KQ.loaiNhot = nhot ? nhot.ten : '';
  KQ.kmDau = nhot ? dinhDang(P.km + nhot.km) : '';   /* không thay nhớt -> để trống */
  KQ.kmLop = dinhDang(mLop);
}

/* --- CHẶN AN TOÀN: không bao giờ in ngày hẹn đã qua cho khách --- */
if(henTg <= HOM_NAY){
  KQ.hen=''; KQ.hanNgay='';
  KQ.canh='Đơn lập ngày '+inNgay(P.ngay)+', hạn 3 tháng là '+inNgay(hanTg)+
          ' — ngày hẹn (trước hạn '+CAU_HINH.NHAC_TRUOC_NGAY+' ngày) đã tới hoặc đã qua. '+
          'Thẻ BỎ TRỐNG dòng lịch hẹn để không in ngày sai cho khách; hẹn lại trực tiếp.';
}else{
  KQ.hen=inNgay(henTg);
}
/* Tracy chốt: 2 dòng "Thay dầu" và "Lịch hẹn lần sau" CHỈ hiện khi phiếu có
   bán nhớt. Không thay nhớt -> để trống cho KTV ghi tay.                   */
if(!KQ.loaiNhot){ KQ.hen=''; }

var TICK=O_TICK.map(function(o){return o.cap.indexOf(KQ.cap)!==-1;});
