<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phi Long Auto — Thẻ nhắc lịch bảo dưỡng</title>
<style>
/* =========================================================================
   PHI LONG AUTO — THẺ TREO NHẮC LỊCH (in 1 mặt)
   File: philongauto.nhaclich.html · repo trolyoto/appsheet
   Bản: v4 (10/11/2026)
   - Tracy chốt 10/11: BỎ HẲN TRANG 1 (mặt logo) -> thẻ chỉ còn 1 trang in.
   - Tracy chốt 10/11: BỎ 2 dòng "Kiểm tra lốp tại km" và "Hoặc ngày"
     -> còn 4 dòng điền: Biển số / Km hiện tại / Thay dầu tại km / Lịch hẹn.
   - Bố cục dựng lại ĐÚNG MẪU IN CHUẨN "the-treo-xem-truoc.png" (764x958 px)
     quy đổi 1 px mẫu = 90/764 mm  ->  thẻ 90 x 112.9 mm, in 1 trang.
   - 6 ô dịch vụ TỰ TICK theo dịch vụ đã làm trên phiếu in (chuỗi &data=).
   - Mốc km/ngày theo ma trận Michelin Car Service (Maintenance pakage.xlsx)
     + cấu hình tab DM_CAP_BD: 5.000 km hoặc 3 tháng, cái nào tới trước.
   KHÔNG đổi bố cục/chữ/màu của mẫu. Chỉ sửa phần CAU_HINH bên dưới.
========================================================================= */
:root{
  --navy:#0E2470; --blue:#02408F; --gold:#F7A81B; --foot:#16359E;
  --mich:#FFCD00; --ink:#15202B; --nen:#E9ECF2;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--navy)}
body{background:var(--nen)}
img{display:block}

/* ---------- thanh công cụ (không in) ---------- */
.bar{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #D8DDE8;
     padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar b{font-size:14px;letter-spacing:.3px}
.bar .sp{flex:1}
.bar button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:9px;
     padding:9px 16px;background:var(--foot);color:#fff;cursor:pointer}
.bar button.ghost{background:#fff;color:var(--foot);border:2px solid var(--foot)}
.canh{background:#FDECEC;border:1px solid #F3C3C3;color:#A4201F;border-radius:9px;
     padding:8px 12px;font-size:13px;font-weight:600;margin:12px auto;max-width:720px}
.giup{max-width:720px;margin:24px auto;background:#fff;border:1px dashed #C9D0DF;
     border-radius:12px;padding:18px;font-size:14px;line-height:1.6;color:#44506B}
.giup code{display:block;background:#F4F6FA;padding:10px;border-radius:8px;margin-top:8px;
     font-size:11px;word-break:break-all}
.khung{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;padding:26px 14px 40px}

/* ---------- thẻ: 764 x 958 px mẫu = 90 x 112.9 mm ---------- */
.card{position:relative;width:90mm;height:112.853mm;background:#fff;overflow:hidden;
      box-shadow:0 3px 14px rgba(16,40,100,.14)}
.wm{position:absolute;top:10.366mm;right:6.832mm;width:48.063mm}
.rule{position:absolute;left:6.597mm;right:6.832mm;height:.17mm;background:var(--gold)}
.fd,.sv{position:absolute;left:6.597mm;right:6.832mm;display:flex;align-items:baseline;
        transform:translateY(-50%)}
.fd{font-size:2.945mm;font-weight:700;letter-spacing:-.005em}
.fl{white-space:nowrap}
.dot{flex:1;margin-left:1.3mm;border-bottom:.2mm dotted #959CB2;min-width:0}
.dot i{font-style:normal;font-weight:700;padding:0 0 0 1.1mm;display:inline-block;
       transform:translateY(-.15mm)}
.title{position:absolute;left:0;right:0;top:52.894mm;transform:translateY(-50%);
       text-align:center;font-weight:800;font-size:3.888mm;letter-spacing:.02em}
.sv{font-size:2.946mm;font-weight:500;align-items:center}
.bx{width:3.298mm;height:3.298mm;border:.28mm solid var(--ink);border-radius:.6mm;flex:none;
    margin-right:2.003mm;position:relative}
.bx.on{background:var(--mich);border-color:var(--mich)}
.bx.on::after{content:'';position:absolute;left:30%;top:4%;width:36%;height:72%;
    border:.45mm solid var(--navy);border-top:0;border-left:0;transform:rotate(42deg)}
.sv .lb{white-space:nowrap}
.sv .dot i{font-weight:600}
.khuyen{position:absolute;left:6.597mm;right:6.832mm;top:86.466mm;transform:translateY(-50%);
   text-align:center;font-size:2.474mm;font-weight:600;color:var(--navy);letter-spacing:.005em}
.khuyen b{font-weight:800}
.qr{position:absolute;left:7.304mm;top:89.764mm;width:10.956mm;height:10.956mm}
.divider{position:absolute;left:21.440mm;top:89.175mm;width:.17mm;height:13.312mm;background:#C8CCDA}
.cta{position:absolute;left:30.864mm;top:89.175mm;font-size:2.709mm;font-weight:800;
     letter-spacing:.06em;line-height:1}
.ic{position:absolute;left:23.796mm;top:92.827mm;width:5.183mm;height:5.183mm;border-radius:50%;
    background:var(--navy);display:flex;align-items:center;justify-content:center}
.ic svg{width:55%;height:55%;fill:#fff}
.pill{position:absolute;left:31.335mm;top:92.827mm;width:34.751mm;height:5.065mm;
      background:var(--gold);color:var(--navy);border-radius:.9mm;display:flex;
      align-items:center;justify-content:center;font-weight:800;font-size:3.652mm;letter-spacing:.01em}
.glb{position:absolute;left:24.031mm;top:99.424mm;width:2.827mm;height:2.827mm}
.glb svg{width:100%;height:100%;fill:var(--navy)}
.web{position:absolute;left:28.974mm;top:100.838mm;transform:translateY(-50%);
     font-size:3.063mm;font-weight:700}
.foot{position:absolute;left:0;right:0;top:107.435mm;height:5.419mm;background:var(--foot)}
.foot::after{content:'';position:absolute;right:0;top:0;bottom:0;width:16.5mm;background:var(--gold);
     clip-path:polygon(33% 0,100% 0,100% 100%,0 100%)}

@media print{
  @page{size:90mm 112.853mm;margin:0}
  body{background:#fff}
  .bar,.canh,.giup{display:none!important}
  .khung{display:block;padding:0;gap:0}
  .card{box-shadow:none;page-break-after:always;break-after:page}
  .card:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<div class="bar">
  <b>THẺ TREO NHẮC LỊCH — PHI LONG AUTO</b>
  <span class="sp"></span>
  <button onclick="window.print()">In / Lưu PDF</button>
  <button class="ghost" onclick="location.href=ZALO_OA">Zalo OA</button>
</div>
<div id="canhbao"></div>
<div class="khung" id="the"></div>

<script>
/* ===================== CAU_HINH — sửa đúng chỗ này ===================== */
var CAU_HINH = {
  CHU_KY_KM      : 5000,   /* DM_CAP_BD: chu kỳ bảo dưỡng theo km            */
  CHU_KY_THANG   : 3,      /* DM_CAP_BD: chu kỳ bảo dưỡng theo tháng         */
  NHAC_TRUOC_NGAY: 7,      /* DM_CAP_BD: số ngày báo TỚI HẠN trước hạn       */
  KM_DAO_LOP     : 10000,  /* Đảo lốp / Cân bằng động: A từ Cấp trung bình   */
  KM_TB_NGAY     : 0       /* KHÔNG dùng: quy đổi km->ngày không phải chuẩn hãng */
};
var ZALO_OA = 'https://zalo.me/s/4166041222749405453/';

/* CHU KỲ THAY NHỚT THEO LOẠI DẦU BÁN TRÊN PHIẾU (Tracy chốt 09/11/2026)
   Thay dầu tại km = KM HIỆN TẠI + số km của loại dầu đã bán.
   CHỈ TÍNH KHI PHIẾU CÓ BÁN NHỚT. Không có nhớt -> dòng này ĐỂ TRỐNG.     */
var CHU_KY_NHOT = [
  {ten:'UNIL OPAL', tu:['unil opal','unilopal','unil-opal','unil'], km:9000},
  {ten:'Q9000',     tu:['q9000','quartz 9000','q 9000'],            km:9000},
  {ten:'Q7000',     tu:['q7000','quartz 7000','q 7000'],            km:7000},
  {ten:'Q5000',     tu:['q5000','quartz 5000','q 5000'],            km:5000}
];
function chuKyNhot(dong){
  for(var i=0;i<CHU_KY_NHOT.length;i++){
    for(var j=0;j<dong.length;j++){
      var t=boDau(dong[j].ten).replace(/\s+/g,' ');
      if(CHU_KY_NHOT[i].tu.some(function(k){return t.indexOf(k)!==-1;})) return CHU_KY_NHOT[i];
    }
  }
  return null;
}

/* 6 ô trên mẫu in — KHÔNG đổi thứ tự, không đổi chữ.
   Ô được tick theo CẤP BẢO DƯỠNG CỦA MỐC KM KẾ TIẾP (ma trận Michelin Car
   Service, file "Maintenance pakage.xlsx"), KHÔNG phải theo việc đã làm hôm nay.
   nho = Cấp nhỏ (5K,15K,25K...) · tb = Cấp trung bình (10K,30K,50K...)
   tbl = Cấp trung bình lớn (20K,60K,100K...) · lon = Cấp lớn (40K,80K,120K...) */
var O_TICK = [
 {ten:'Đảo lốp',                      cap:['tb','tbl','lon']},   /* A từ Cấp trung bình   */
 {ten:'Cân bằng động',                cap:['tb','tbl','lon']},   /* A từ Cấp trung bình   */
 {ten:'Kiểm tra thước lái (độ chụm)', cap:['nho','tb','tbl','lon']}, /* Góc đặt bánh xe   */
 {ten:'Kiểm tra lốp',                 cap:['nho','tb','tbl','lon']}, /* Kiểm tra an toàn  */
 {ten:'Láng đĩa',                     cap:['tb','tbl','lon']},   /* Phanh: A từ cấp TB    */
 {ten:'Kiểm tra an toàn xe (3 tháng)',cap:['nho','tb','tbl','lon']} /* bắt buộc mọi cấp   */
];
/* Hạng mục THAY THẾ (R) của từng cấp, đưa xuống dòng "DV khác".
   Dầu động cơ đã có dòng "Thay dầu (Nhớt) tại km" nên không lặp lại ở đây. */
var DV_KHAC_THEO_CAP = {
 nho : [],
 tb  : ['Lọc dầu ĐC','Gạt mưa'],
 tbl : ['Lọc dầu ĐC','Lọc gió ĐC','Lọc gió máy lạnh','Ắc quy','Gạt mưa'],
 lon : ['Lọc dầu ĐC','Lọc gió ĐC','Lọc gió máy lạnh','Ắc quy','Gạt mưa','Dầu phanh']
};
/* ===================== hết phần cấu hình ===================== */

function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
  return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
function boDau(s){return (s||'').toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();}
function soNguyen(v){var n=parseInt(String(v||'').replace(/[^\d-]/g,''),10);return isNaN(n)?null:n;}
function laSo(v){var s=String(v==null?'':v).trim();return !!s&&/^-?[\d.,\s]+$/.test(s);}
function dinhDang(n){return (n==null||isNaN(n))?'':Math.round(n).toLocaleString('vi-VN');}
function docNgay(s){s=String(s||'').trim();if(!s)return null;
  var m=/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(s);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null;}
function inNgay(d){if(!(d instanceof Date)||isNaN(d))return '';
  var p=function(x){return (x<10?'0':'')+x;};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();}
function themThang(d,n){var x=new Date(d.getTime()),ng=x.getDate();
  x.setMonth(x.getMonth()+n);if(x.getDate()<ng)x.setDate(0);return x;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- 1. Đọc tham số ---------- */
var P={bienso:qs('bienso')||qs('bs'), kh:qs('kh'), cn:qs('cn'),
       km:soNguyen(qs('km')), ngay:docNgay(qs('ngay')), data:qs('data')};
if(!P.ngay){var h=new Date();h.setHours(0,0,0,0);P.ngay=h;}

/* ---------- 2. Tách chuỗi data của nút In bill ----------
   dòng nối bằng _b_ , cột nối bằng _a_ ; tên hàng có thể kèm _c_<giá gốc>
   Kiểu bill : ten_sp[_c_giá gốc] _a_ giá bán _a_ số lượng
   Kiểu đầy đủ: ten_sp _a_ nhom_hang _a_ ngay _a_ km                        */
function docDong(d){
  var c=d.split('_a_'), ten=(c[0]||'').split('_c_')[0].trim();
  if(!ten) return null;
  var kieuBill = laSo(c[1]) || c.length<3;
  return {ten:ten, nhom: kieuBill?'':(c[1]||'').trim().toUpperCase()};
}
var DONG = (P.data?P.data.split('_b_'):[]).map(docDong).filter(Boolean);

/* ---------- 3. Mốc km, cấp bảo dưỡng kế tiếp ---------- */
function mocKeTiep(km,buoc){return (Math.floor(km/buoc)+1)*buoc;}
function maCap(moc){var n=moc/CAU_HINH.CHU_KY_KM;
  if(n%8===0)return 'lon'; if(n%4===0)return 'tbl';
  if(n%2===0)return 'tb';  return 'nho';}
var TEN_CAP={nho:'Cấp nhỏ',tb:'Cấp trung bình',tbl:'Cấp trung bình lớn',lon:'Cấp lớn'};

/* ---------- 4. Mốc km & ngày hẹn ---------- */
var KQ={kmLop:'',kmDau:'',hanNgay:'',hen:'',cap:'nho',tenCap:'',canh:''};
var HOM_NAY=new Date(); HOM_NAY.setHours(0,0,0,0);

/* --- Mốc thời gian: chuẩn hãng = ngày làm dịch vụ + 3 tháng --- */
var hanTg = themThang(P.ngay, CAU_HINH.CHU_KY_THANG);
KQ.hanNgay = inNgay(hanTg);

/* --- Ngày hẹn = trước hạn 7 ngày, để khách tới TRƯỚC khi quá hạn --- */
var henTg = new Date(hanTg.getTime());
henTg.setDate(henTg.getDate() - CAU_HINH.NHAC_TRUOC_NGAY);

/* --- Mốc km theo cấp bảo dưỡng --- */
if(P.km!==null && P.km>0){
  var mDau=mocKeTiep(P.km,CAU_HINH.CHU_KY_KM);
  var mLop=mocKeTiep(P.km,CAU_HINH.KM_DAO_LOP);
  /* Cấp bảo dưỡng vẫn theo mốc 5.000 chuẩn Michelin */
  KQ.cap=maCap(mDau); KQ.tenCap=TEN_CAP[KQ.cap];
  /* Riêng dòng THAY DẦU chạy theo loại nhớt đã bán */
  var nhot=chuKyNhot(DONG);
  KQ.loaiNhot = nhot ? nhot.ten : '';
  KQ.kmDau = nhot ? dinhDang(P.km + nhot.km) : '';   /* không thay nhớt -> để trống */
  KQ.kmLop = dinhDang(mLop);
}

/* --- CHẶN AN TOÀN: không bao giờ in ngày hẹn đã qua cho khách --- */
if(henTg <= HOM_NAY){
  KQ.hen=''; KQ.hanNgay='';
  KQ.canh='Đơn lập ngày '+inNgay(P.ngay)+', hạn 3 tháng là '+inNgay(hanTg)+
          ' — ngày hẹn (trước hạn '+CAU_HINH.NHAC_TRUOC_NGAY+' ngày) đã tới hoặc đã qua. '+
          'Thẻ BỎ TRỐNG dòng lịch hẹn để không in ngày sai cho khách; hẹn lại trực tiếp.';
}else{
  KQ.hen=inNgay(henTg);
}
/* Tracy chốt: 2 dòng "Thay dầu" và "Lịch hẹn lần sau" CHỈ hiện khi phiếu có
   bán nhớt. Không thay nhớt -> để trống cho KTV ghi tay.                   */
if(!KQ.loaiNhot){ KQ.hen=''; }

var TICK=O_TICK.map(function(o){return o.cap.indexOf(KQ.cap)!==-1;});
var KHAC=[];   /* Tracy chốt: dòng DV khác LUÔN để trống cho viết tay */

/* ---------- 5. Dựng thẻ (1 mặt) ---------- */
var WORDMARK='plg_wordmark.png', QR='plg_qr.png';
var YF=[29.450,33.848,38.246,42.644];                   /* tâm 4 dòng điền (mm)    */
var YS=[58.842,63.459,68.077,72.695,77.313,81.931,86.548]; /* tâm 6 dòng dịch vụ   */
function dongDien(y,nhan,gt){
  return '<div class="fd" style="top:'+y+'mm"><span class="fl">'+nhan+'</span>'+
         '<span class="dot"><i>'+esc(gt)+'</i></span></div>';
}
function dongDV(y,on,nhan,phu){
  return '<div class="sv" style="top:'+y+'mm"><span class="bx'+(on?' on':'')+'"></span>'+
         '<span class="lb">'+nhan+'</span>'+
         (phu!==undefined?'<span class="dot"><i>'+esc(phu)+'</i></span>':'')+'</div>';
}
var H='';
H+='<div class="card">'+
   '<img class="wm" src="'+WORDMARK+'" alt="Phi Long">'+
   '<div class="rule" style="top:22.853mm"></div>'+
   dongDien(YF[0],'Biển số xe:',P.bienso)+
   dongDien(YF[1],'Km hiện tại:',P.km!==null&&P.km>0?dinhDang(P.km):'')+
   dongDien(YF[2],'Thay dầu (Nhớt) tại km:',KQ.kmDau)+
   dongDien(YF[3],'Lịch hẹn lần sau:',KQ.hen)+
   '<div class="rule" style="top:49.241mm"></div>'+
   '<div class="title">CÁC DỊCH VỤ ĐỀ XUẤT</div>';
for(var i=0;i<O_TICK.length;i++) H+=dongDV(YS[i],TICK[i],esc(O_TICK[i].ten));
H+=dongDV(YS[6],false,'DV khác:','');
H+='<img class="qr" src="'+QR+'" alt="Zalo OA Phi Long">'+
   '<div class="divider"></div>'+
   '<div class="cta">ĐẶT LỊCH NGAY</div>'+
   '<div class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg></div>'+
   '<div class="pill">0975 76 77 78</div>'+
   '<div class="glb"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 9h-3a15.5 15.5 0 00-1.1-5.2A8 8 0 0118.9 11zM12 4c.8 1.1 1.6 3.3 1.8 7h-3.6c.2-3.7 1-5.9 1.8-7zM4.3 15A8 8 0 014 13h3.1c0 .7.1 1.4.2 2H4.3zm0-6h3c-.1.6-.2 1.3-.2 2H4c0-.7.1-1.4.3-2zm.9 8h2.6c.3 1.6.7 3 1.2 4A8 8 0 015.2 17zM9.1 5.8A15.5 15.5 0 008 11H5.1a8 8 0 014-5.2zM12 20c-.8-1.1-1.6-3.3-1.8-7h3.6c-.2 3.7-1 5.9-1.8 7zm2.9-.2c.5-1 .9-2.4 1.2-4h2.6a8 8 0 01-3.8 4zM16.7 15c.1-.6.2-1.3.2-2H20c0 .7-.1 1.4-.3 2h-3z"/></svg></div>'+
   '<div class="web">philongauto.com</div>'+
   '<div class="foot"></div></div>';

if(!P.bienso){
  document.getElementById('the').innerHTML='';
  document.getElementById('canhbao').innerHTML=
   '<div class="giup"><b>Chưa có dữ liệu xe.</b><br>Trang nhận dữ liệu từ app PhiLong Auto qua link. Mẫu link:'+
   '<code>philongauto.nhaclich.html?bienso=93A-561.54&amp;km=96506&amp;ngay=09/11/2026'+
   '&amp;data=Bridgestone 205/55R16 T06_a_2440000_a_2_b_#Alignments Hunter Usa - Cân Chỉnh Thước Lái_a_500000_a_1</code></div>';
}else{
  document.getElementById('the').innerHTML=H;
  var cb=[];
  if(KQ.canh) cb.push(KQ.canh);
  if(P.km===null||P.km<=0) cb.push('Đơn KHÔNG có số km (odo) → các dòng km để trống, chỉ nhắc theo thời gian. Cần nhập km khi tạo đơn.');
  if(!DONG.length) cb.push('Link không có chuỗi &data= → không tick được dịch vụ nào.');
  if(cb.length) document.getElementById('canhbao').innerHTML=
    '<div class="canh">⚠ '+cb.join('<br>⚠ ')+'</div>';
  document.title='The treo nhac lich - '+P.bienso;
